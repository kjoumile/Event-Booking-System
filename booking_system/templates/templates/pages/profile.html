{% extends "../base.html" %}
{% block title %}Мой профиль{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Карточка профиля -->
            <div class="card border-0 shadow">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="mb-0">
                        <i class="bi bi-person-circle me-2"></i>Профиль
                    </h3>
                </div>
                
                <div class="card-body p-5">
                    <!-- Информация о пользователе -->
                    <div class="text-center mb-5">
                        <div class="mb-3">
                            <i class="bi bi-person-badge" style="font-size: 48px; color: #6c757d;"></i>
                        </div>
                        <h4 class="mb-1">{{ user.username }}</h4>
                        <p class="text-muted">Пользователь системы</p>
                    </div>
                    
                    <!-- Баланс -->
                    <div class="bg-light p-4 rounded mb-4 text-center">
                        <p class="text-muted mb-2">Баланс</p>
                        <h2 class="text-success">{{ profile.balance|floatformat:2 }} ₽</h2>
                    </div>
                    
                    <!-- Кнопки действий -->
                    <div class="d-grid gap-3">
                        <!-- Пополнение баланса -->
                        <a href="{% url 'payment-topup' %}" class="btn btn-success btn-lg">
                            <i class="bi bi-plus-circle me-2"></i>Пополнить баланс
                        </a>
                        
                        <!-- Выход -->
                        <form method="POST" action="{% url 'login' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-box-arrow-right me-2"></i>Выйти из системы
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
