<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Профиль пользователя</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Профиль пользователя</h3>

            <p><strong>Имя:</strong> {{ user.username }}</p>
            <p><strong>Баланс:</strong> {{ user.profile.balance }} ₽</p>

            <!-- Кнопка пополнения -->
            <a href="/profiles/{{ user.profile.id }}/" class="btn btn-success w-100">Пополнить баланс</a>
        </div>
    </div>
</div>

<!-- Bootstrap JS (опционально) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
